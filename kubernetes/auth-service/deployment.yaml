apiVersion: apps/v1

kind: Deployment

metadata:
  name: auth-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: auth-service

  template:
    metadata:
      labels:
        app: auth-service

    spec:
      containers:
        - name: auth-service
          image: omnicart-auth-service:local
          imagePullPolicy: Never

          ports:
            - containerPort: 3001

          env:
            - name: PORT
              value: "3001"

            - name: NODE_ENV
              value: "production"

            - name: JWT_ACCESS_EXPIRATION
              valueFrom:
                secretKeyRef:
                  name: auth-service-secret
                  key: JWT_ACCESS_EXPIRATION

            - name: JWT_REFRESH_EXPIRATION
              valueFrom:
                secretKeyRef:
                  name: auth-service-secret
                  key: JWT_REFRESH_EXPIRATION

            # Sensitive configuration
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: auth-service-secret
                  key: MONGODB_URI

            - name: JWT_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-service-secret
                  key: JWT_ACCESS_SECRET

            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-service-secret
                  key: JWT_REFRESH_SECRET